<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.2" fill="#3d4654"/>
    </marker>
    <!-- Icons: style attrs live on the <g id> itself, never a wrapping
         ancestor (<use> only clones the referenced element's own
         attributes). Defined inside <defs> so they render only via <use>,
         not a second time at their own definition point. -->
    <g id="doc-icon" stroke="#2496ed" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 1.5h5l2.5 2.5V11a.6.6 0 0 1-.6.6H2.6A.6.6 0 0 1 2 11V2.1a.6.6 0 0 1 .6-.6z"/>
      <path d="M7 1.5V4h2.5"/>
      <line x1="3.4" y1="6.8" x2="7.6" y2="6.8"/>
      <line x1="3.4" y1="8.8" x2="7.6" y2="8.8"/>
    </g>
    <g id="bolt-icon" stroke="#f38020" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2 L5 13.5h7l-1.2 8.5L18 10.5h-7z"/>
    </g>
    <g id="db-icon" stroke="#58a6ff" fill="none" stroke-width="1.4" stroke-linecap="round">
      <ellipse cx="10" cy="4" rx="8" ry="3"/>
      <path d="M2 4v14c0 1.7 3.6 3 8 3s8-1.3 8-3V4"/>
      <path d="M2 11c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </g>
    <g id="browser-icon" stroke="#3fb950" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="26" height="20" rx="2.5"/>
      <line x1="1" y1="7" x2="27" y2="7"/>
      <circle cx="5.5" cy="4" r="0.9" fill="#3fb950" stroke="none"/>
      <circle cx="9" cy="4" r="0.9" fill="#3fb950" stroke="none"/>
    </g>
    <g id="user-icon" stroke="#9aa4b2" fill="none" stroke-width="1.4" stroke-linecap="round">
      <circle cx="11" cy="6" r="5"/>
      <path d="M1 23c0-6 4.5-10.4 10-10.4S21 17 21 23"/>
    </g>
  </defs>

  <rect width="760" height="560" rx="10" fill="#0a0d12"/>
  <rect x="0.5" y="0.5" width="759" height="559" rx="10" fill="none" stroke="#1c222c" stroke-width="1"/>

  <!-- Title -->
  <text x="32" y="36" fill="#e6edf3" font-size="17" font-weight="600">Entra Tracker</text>
  <text x="32" y="54" fill="#9aa4b2" font-size="11">7 Microsoft-official sources · Cloudflare Worker · cron every 4h</text>
  <line x1="32" y1="68" x2="728" y2="68" stroke="#1c222c" stroke-width="1"/>

  <!-- ── SOURCES: single row of 7, avoids any connector/box-crossing issue ── -->
  <text x="32" y="90" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">SOURCES</text>

  <g font-size="9.5">
    <g transform="translate(32,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">whats-new.md</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">entra-docs</text></g>
    <g transform="translate(132,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">FSLogix notes</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">learn.microsoft.com</text></g>
    <g transform="translate(232,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">External ID docs</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">entra-docs</text></g>
    <g transform="translate(332,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">B2C docs</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">azure-docs</text></g>
    <g transform="translate(432,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">Customer commits</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">GitHub API</text></g>
    <g transform="translate(532,98)"><rect width="94" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">Graph changelog</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">RSS</text></g>
    <g transform="translate(632,98)"><rect width="96" height="56" rx="7" fill="#12161d" stroke="#242b36"/><use href="#doc-icon" transform="translate(10,10)"/><text x="10" y="34" fill="#c9d1d9" font-weight="600" font-size="9">M365 Roadmap</text><text x="10" y="46" fill="#9aa4b2" font-size="7.5">JSON API</text></g>
  </g>

  <!-- Connectors: each source's bottom-center fans straight down into the
       Worker box's top edge, no diagonal crossing over any other box,
       since there is now only one source row above the Worker. -->
  <g stroke="#2c3542" stroke-width="1.1" fill="none">
    <path d="M79,154 L79,168 Q79,180 130,180 L200,180 Q220,180 220,196"/>
    <path d="M179,154 L179,168 Q179,178 230,178 L260,178 Q280,178 280,196"/>
    <path d="M279,154 L279,196"/>
    <path d="M379,154 L379,196"/>
    <path d="M479,154 L479,168 Q479,178 440,178 L420,178 Q400,178 400,196"/>
    <path d="M579,154 L579,168 Q579,180 480,180 L460,180 Q460,180 460,196"/>
    <path d="M680,154 L680,168 Q680,182 550,182 L530,182 Q520,182 520,196"/>
  </g>

  <!-- ── PROCESSING ────────────────────────────────────────────── -->
  <text x="32" y="192" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">PROCESSING</text>

  <g transform="translate(32,198)">
    <rect width="696" height="84" rx="8" fill="#151009" stroke="#3a2410"/>
    <use href="#bolt-icon" transform="translate(18,14)"/>
    <text x="48" y="28" fill="#f38020" font-size="13" font-weight="700">Cloudflare Worker</text>
    <text x="48" y="44" fill="#9aa4b2" font-size="9.5">entra-tracker · fetch + scheduled handlers</text>
    <g font-size="8.7" fill="#b9c0cb">
      <rect x="18" y="56" width="150" height="20" rx="10" fill="none" stroke="#3a2410"/><text x="93" y="69.5" text-anchor="middle">Parse + classify</text>
      <rect x="180" y="56" width="150" height="20" rx="10" fill="none" stroke="#3a2410"/><text x="255" y="69.5" text-anchor="middle">Dedupe + merge</text>
      <rect x="342" y="56" width="160" height="20" rx="10" fill="none" stroke="#3a2410"/><text x="422" y="69.5" text-anchor="middle">Evidence + deadline</text>
      <rect x="514" y="56" width="164" height="20" rx="10" fill="none" stroke="#3a2410"/><text x="596" y="69.5" text-anchor="middle">Degraded-source gate</text>
    </g>
  </g>

  <path d="M270,282 L270,296 Q270,306 300,306 L300,318" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>
  <path d="M458,282 L458,296 Q458,306 460,306 L460,318" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <!-- ── STORAGE ───────────────────────────────────────────────── -->
  <text x="32" y="312" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>

  <g transform="translate(120,320)">
    <rect width="240" height="64" rx="8" fill="#0d1522" stroke="#1c2c42"/>
    <use href="#db-icon" transform="translate(16,14) scale(0.85)"/>
    <text x="46" y="28" fill="#58a6ff" font-size="12" font-weight="700">KV · ENTRA_CACHE</text>
    <text x="46" y="43" fill="#9aa4b2" font-size="8.5">Article cache + health snapshot</text>
    <text x="46" y="55" fill="#6b7684" font-size="8">4h HTTP cache · 30-day KV backstop</text>
  </g>

  <g transform="translate(400,320)">
    <rect width="240" height="64" rx="8" fill="#0d1522" stroke="#1c2c42"/>
    <use href="#db-icon" transform="translate(16,14) scale(0.85)"/>
    <text x="46" y="28" fill="#58a6ff" font-size="12" font-weight="700">D1 · history</text>
    <text x="46" y="43" fill="#9aa4b2" font-size="8.5">Per-item revision log</text>
    <text x="46" y="55" fill="#6b7684" font-size="8">Powers deadline-slip history</text>
  </g>

  <path d="M240,384 L240,398 Q240,408 340,408 L340,418" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>
  <path d="M520,384 L520,398 Q520,408 440,408 L440,418" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <!-- ── DELIVERY ──────────────────────────────────────────────── -->
  <text x="32" y="412" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">DELIVERY</text>

  <g transform="translate(190,420)">
    <rect width="380" height="60" rx="8" fill="#0a1710" stroke="#153322"/>
    <use href="#browser-icon" transform="translate(16,14)"/>
    <text x="54" y="28" fill="#3fb950" font-size="12" font-weight="700">Cloudflare Pages</text>
    <text x="54" y="43" fill="#9aa4b2" font-size="8.5">entratracker.aboutcloud.io</text>
    <text x="54" y="55" fill="#6b7684" font-size="8">Unified filter bar · slip-history timeline · RSS/CSV/ICS</text>
  </g>

  <path d="M380,480 L380,500" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <!-- Users -->
  <g transform="translate(320,504)">
    <use href="#user-icon" transform="translate(0,0)"/>
    <text x="30" y="10" fill="#c9d1d9" font-size="11" font-weight="600">Users</text>
    <text x="30" y="24" fill="#9aa4b2" font-size="8.5">Search · filter · subscribe (RSS/CSV/ICS)</text>
  </g>

  <!-- Footer -->
  <text x="728" y="546" text-anchor="end" fill="#6b7684" font-size="9">Auto-updated every 4h · €0/month · Open Source</text>
</svg>
