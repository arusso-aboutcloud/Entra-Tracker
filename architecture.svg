<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#553098"/>
    </linearGradient>
    <linearGradient id="kv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0366d6"/>
      <stop offset="100%" stop-color="#0250a3"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f58423"/>
      <stop offset="100%" stop-color="#c96410"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#1a7f32"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowD" markerWidth="7" markerHeight="10" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="760" height="560" rx="12" fill="url(#bg)"/>
  <rect width="760" height="560" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Entra Tracker — Architecture</text>
  <text x="380" y="48" text-anchor="middle" fill="#8b949e" font-size="11">7 Microsoft-official sources · parallel fetch · cron every 4h</text>

  <!-- Sources: 7 boxes, two rows of 4/3 -->
  <g font-size="9.5">
    <!-- row 1 -->
    <g transform="translate(28,64)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">1. whats-new.md</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">entra-docs · Markdown</text></g>
    <g transform="translate(136,64)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">2. FSLogix notes</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">learn.microsoft.com · HTML</text></g>
    <g transform="translate(244,64)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">3. External ID docs</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">entra-docs · Markdown</text></g>
    <g transform="translate(352,64)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">4. B2C docs</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">azure-docs · Markdown</text></g>
    <!-- row 2 -->
    <g transform="translate(82,118)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">5. Customer commits</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">GitHub Commits API</text></g>
    <g transform="translate(190,118)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">6. Graph changelog</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">developer.microsoft.com · RSS</text></g>
    <g transform="translate(298,118)"><rect width="98" height="46" rx="7" fill="url(#src)"/><text x="49" y="18" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">7. M365 Roadmap</text><text x="49" y="32" text-anchor="middle" fill="#eaf6ff" font-size="8.5">microsoft.com · JSON API</text></g>
  </g>

  <!-- Arrows: sources -> worker -->
  <path d="M77,110 L280,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M185,110 L320,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M293,110 L360,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M401,110 L400,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M131,164 L440,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M239,164 L460,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>
  <path d="M347,164 L480,192" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrowD)" opacity="0.55"/>

  <!-- Worker -->
  <g transform="translate(140,196)">
    <rect width="480" height="98" rx="10" fill="url(#worker)" filter="url(#glow)"/>
    <text x="240" y="22" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">Cloudflare Worker · entra-tracker</text>
    <text x="240" y="37" text-anchor="middle" fill="#e8ddff" font-size="9.5">fetch + scheduled handlers · parallel source fetch</text>
    <g font-size="9" fill="#f3ecff">
      <rect x="16" y="50" width="98" height="32" rx="6" fill="#ffffff22"/><text x="65" y="70" text-anchor="middle">Parse + classify</text>
      <rect x="126" y="50" width="98" height="32" rx="6" fill="#ffffff22"/><text x="175" y="70" text-anchor="middle">Dedupe + merge</text>
      <rect x="236" y="50" width="98" height="32" rx="6" fill="#ffffff22"/><text x="285" y="70" text-anchor="middle">Evidence + deadline</text>
      <rect x="346" y="50" width="118" height="32" rx="6" fill="#ffffff22"/><text x="405" y="70" text-anchor="middle">Degraded-source gate</text>
    </g>
  </g>

  <!-- Worker -> KV / D1 -->
  <path d="M300,294 L230,336" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowD)"/>
  <path d="M460,294 L530,336" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowD)"/>

  <!-- KV -->
  <g transform="translate(90,338)">
    <rect width="280" height="54" rx="9" fill="url(#kv)"/>
    <text x="140" y="21" text-anchor="middle" fill="#fff" font-weight="700" font-size="11.5">KV · ENTRA_CACHE</text>
    <text x="140" y="36" text-anchor="middle" fill="#d9ecff" font-size="8.5">Article cache + per-source health snapshot</text>
    <text x="140" y="48" text-anchor="middle" fill="#d9ecff" font-size="8.5">4h HTTP cache · 30-day KV backstop TTL</text>
  </g>

  <!-- D1 -->
  <g transform="translate(400,338)">
    <rect width="280" height="54" rx="9" fill="url(#d1)"/>
    <text x="140" y="21" text-anchor="middle" fill="#fff" font-weight="700" font-size="11.5">D1 · entra-tracker-history</text>
    <text x="140" y="36" text-anchor="middle" fill="#ffe9d6" font-size="8.5">Per-item revision log, written on real change</text>
    <text x="140" y="48" text-anchor="middle" fill="#ffe9d6" font-size="8.5">Powers deadline-slip history · non-fatal if down</text>
  </g>

  <!-- KV+D1 -> Pages -->
  <path d="M290,394 L380,442" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowD)"/>
  <path d="M480,394 L400,442" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowD)"/>

  <!-- Pages -->
  <g transform="translate(180,444)">
    <rect width="400" height="56" rx="9" fill="url(#pages)"/>
    <text x="200" y="22" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">Cloudflare Pages</text>
    <text x="200" y="38" text-anchor="middle" fill="#e3f9e8" font-size="9">entratracker.aboutcloud.io</text>
    <text x="200" y="50" text-anchor="middle" fill="#e3f9e8" font-size="8.5">Unified filter bar · slip-history timeline · RSS/CSV/ICS export</text>
  </g>

  <!-- Pages -> Users -->
  <path d="M380,500 L380,522" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#arrowD)"/>
  <text x="380" y="540" text-anchor="middle" fill="#c9d1d9" font-size="11">🔍 Users — search · filter · subscribe (RSS/CSV/ICS)</text>

  <!-- Footer -->
  <text x="380" y="556" text-anchor="middle" fill="#6e7681" font-size="9">Auto-updated every 4 hours · €0/month · Open Source</text>
</svg>
